version: "3.8"

services:
  portal:
    # SQS-51 (A4): NEXT_PUBLIC_* precisa ir como build args — Next.js inlina
    # essas variáveis em build time. Antes só estavam em `environment` (runtime),
    # o que deixava o bundle do browser sem URL/anon key Supabase.
    build:
      context: ./cuca-portal
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_WORKER_URL: ${NEXT_PUBLIC_WORKER_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION}
    container_name: cuca-portal
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WORKER_URL=http://worker:8000
    depends_on:
      - worker

  worker:
    build: ./worker
    container_name: cuca-worker
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./worker/.env
    command: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8000 --timeout 300 --graceful-timeout 30

  nginx:
    image: nginx:alpine
    container_name: cuca-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - portal
      - worker
