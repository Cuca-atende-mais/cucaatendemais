[pytest]
# Fixa onde os testes vivem e de onde os imports resolvem, para que o resultado
# não dependa do diretório em que o pytest foi invocado. Sem isto, rodar de dentro
# de worker/ produz ModuleNotFoundError em testes que importam `worker.<modulo>`,
# e rodar da raiz quebra os que importam `main` direto.
testpaths = worker/tests
pythonpath = . worker
