# ─── 7 Quality Checks ────────────────────────────────────────────────────────

checks:
  code_review:
    status: PASS
    notes: |
      - `IntencaoDetector`: estrutura limpa, keyword priority correta (empresa > banco_talentos > candidato_vaga > GPT).
      - Validação de categoria GPT em dois pontos (dentro de `_gpt_fallback` E em `classificar`) — redundância defensiva aceitável.
      - `_log_intencao`: lê metadata atual antes de escrever (merge não-destrutivo). Correto.
      - `_rotear_por_intencao`: todos os fluxos verificados contra `_ETAPAS_EMPRESA`, `_ETAPAS_PUBLICO`:
          * `aguardando_cnpj` → confirmado em `_ETAPAS_EMPRESA` (linha 1851). ✅
          * `listou_vagas` → confirmado em `_ETAPAS_PUBLICO` (linha 1864). ✅
