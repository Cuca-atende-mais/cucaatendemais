# ─── Issues ──────────────────────────────────────────────────────────────────

issues:
  - severity: low
    category: code
    description: |
      `_rotear_por_intencao` para candidato_vaga usa `select("id, titulo, descricao")`.
      O Dev Notes da story sugeria incluir `empresas(nome)` para mostrar empresa na listagem.
      O AC#1 não exige o campo empresa — apenas "lista de vagas abertas sem menu numerado".
    recommendation: Incluir empresa na listagem em story futura (S-EMP-01-02+) junto com outros refinamentos de UX.

  - severity: low
    category: tests
    description: |
      `asyncio.get_event_loop()` em `_classif()` emite DeprecationWarning no Python 3.12.
      Não afeta a execução dos testes nem o código de produção (que é async nativo).
    recommendation: Migrar o helper de teste para `asyncio.run()` ou usar `pytest-asyncio` com `@pytest.mark.asyncio` em story futura de limpeza de testes.

  - severity: low
    category: performance
    description: |
      `_log_intencao` faz 2 round-trips ao Supabase (SELECT metadata + UPDATE).
      Poderia ser um único `rpc('jsonb_set_key', ...)` ou UPDATE com jsonb_set.
    recommendation: Otimização opcional em refactor futuro; impacto real negligível no volume atual.

