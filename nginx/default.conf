upstream portal {
    server portal:3000;
}

upstream worker {
    server worker:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # -------------------------------------------------------
    # Assets estáticos do Next.js — imutáveis (têm hash no nome)
    # Cache agressivo no browser — nunca colide entre deploys
    # -------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # -------------------------------------------------------
    # HMR / webpack hot reload (WebSocket do Next.js dev)
    # Mantido por segurança para não quebrar em ambientes híbridos
    # -------------------------------------------------------
    location /_next/webpack-hmr {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # -------------------------------------------------------
    # Imagens otimizadas pelo Next.js Image Optimization
    # -------------------------------------------------------
    location /_next/image {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    }

    # -------------------------------------------------------
    # Worker API — sem cache, respostas sempre frescas
    # -------------------------------------------------------
    location /api/worker/ {
        rewrite ^/api/worker/(.*) /$1 break;
        proxy_pass http://worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # -------------------------------------------------------
    # Tudo o mais: páginas HTML, rotas Next.js, API routes
    # NUNCA cachear — Next.js cuida do revalidation
    # -------------------------------------------------------
    location / {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }
}
